<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c1e"/>
      <stop offset="100%" stop-color="#0c1929"/>
    </linearGradient>
    <!-- Node gradients -->
    <radialGradient id="nodePatient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.4"/>
    </radialGradient>
    <radialGradient id="nodeServer" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.4"/>
    </radialGradient>
    <radialGradient id="nodeAI" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4b5fd" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.4"/>
    </radialGradient>
    <radialGradient id="nodeFHIR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.4"/>
    </radialGradient>
    <radialGradient id="nodeDB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.4"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="lineGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Animated dash for edges -->
    <marker id="arrowGreen" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#6ee7b7"/>
    </marker>
    <marker id="arrowPurple" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c4b5fd"/>
    </marker>
    <marker id="arrowBlue" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#93c5fd"/>
    </marker>
    <marker id="arrowRed" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#fda4af"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="520" fill="url(#bg)"/>

  <!-- Grid subtle -->
  <g stroke="#ffffff" stroke-width="0.3" opacity="0.04">
    <line x1="0" y1="52" x2="1000" y2="52"/>
    <line x1="0" y1="104" x2="1000" y2="104"/>
    <line x1="0" y1="156" x2="1000" y2="156"/>
    <line x1="0" y1="208" x2="1000" y2="208"/>
    <line x1="0" y1="260" x2="1000" y2="260"/>
    <line x1="0" y1="312" x2="1000" y2="312"/>
    <line x1="0" y1="364" x2="1000" y2="364"/>
    <line x1="0" y1="416" x2="1000" y2="416"/>
    <line x1="0" y1="468" x2="1000" y2="468"/>
    <line x1="100" y1="0" x2="100" y2="520"/>
    <line x1="200" y1="0" x2="200" y2="520"/>
    <line x1="300" y1="0" x2="300" y2="520"/>
    <line x1="400" y1="0" x2="400" y2="520"/>
    <line x1="500" y1="0" x2="500" y2="520"/>
    <line x1="600" y1="0" x2="600" y2="520"/>
    <line x1="700" y1="0" x2="700" y2="520"/>
    <line x1="800" y1="0" x2="800" y2="520"/>
    <line x1="900" y1="0" x2="900" y2="520"/>
  </g>

  <!-- Title -->
  <text x="500" y="40" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700"
    text-anchor="middle" fill="#e5e7eb" letter-spacing="3">SYSTEM ARCHITECTURE</text>
  <line x1="300" y1="48" x2="700" y2="48" stroke="#6b7280" stroke-width="0.5"/>

  <!-- =========================================
       EDGES / DATA FLOW LINES
  ========================================== -->

  <!-- Patient <-> Server (bidirectional) -->
  <line x1="185" y1="200" x2="365" y2="200" stroke="#6ee7b7" stroke-width="1.5"
    stroke-dasharray="6,4" marker-end="url(#arrowGreen)" filter="url(#lineGlow)" opacity="0.8">
    <animate attributeName="stroke-dashoffset" values="0;-20" dur="1.5s" repeatCount="indefinite"/>
  </line>
  <line x1="365" y1="215" x2="185" y2="215" stroke="#fde68a" stroke-width="1.5"
    stroke-dasharray="6,4" marker-end="url(#arrowGreen)" filter="url(#lineGlow)" opacity="0.8">
    <animate attributeName="stroke-dashoffset" values="0;-20" dur="1.5s" repeatCount="indefinite"/>
  </line>

  <!-- Server <-> Private AI -->
  <line x1="500" y1="155" x2="500" y2="88" stroke="#c4b5fd" stroke-width="1.5"
    stroke-dasharray="6,4" marker-end="url(#arrowPurple)" filter="url(#lineGlow)" opacity="0.8">
    <animate attributeName="stroke-dashoffset" values="0;-20" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <line x1="515" y1="88" x2="515" y2="155" stroke="#c4b5fd" stroke-width="1.5"
    stroke-dasharray="6,4" marker-end="url(#arrowPurple)" filter="url(#lineGlow)" opacity="0.8">
    <animate attributeName="stroke-dashoffset" values="0;-20" dur="1.2s" repeatCount="indefinite"/>
  </line>

  <!-- Server <-> Cloud LLM (dashed lower path) -->
  <path d="M 500 245 Q 660 245 660 310" stroke="#c4b5fd" stroke-width="1.2"
    stroke-dasharray="5,5" fill="none" marker-end="url(#arrowPurple)" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="0;-20" dur="2s" repeatCount="indefinite"/>
  </path>

  <!-- Server <-> SQLite DB -->
  <line x1="635" y1="200" x2="815" y2="200" stroke="#fda4af" stroke-width="1.5"
    stroke-dasharray="6,4" marker-end="url(#arrowRed)" filter="url(#lineGlow)" opacity="0.8">
    <animate attributeName="stroke-dashoffset" values="0;-20" dur="1.8s" repeatCount="indefinite"/>
  </line>
  <line x1="815" y1="215" x2="635" y2="215" stroke="#fda4af" stroke-width="1.5"
    stroke-dasharray="6,4" marker-end="url(#arrowRed)" filter="url(#lineGlow)" opacity="0.8">
    <animate attributeName="stroke-dashoffset" values="0;-20" dur="1.8s" repeatCount="indefinite"/>
  </line>

  <!-- Server -> FHIR -->
  <path d="M 500 245 Q 500 390 210 390" stroke="#93c5fd" stroke-width="1.5"
    stroke-dasharray="6,4" fill="none" marker-end="url(#arrowBlue)" filter="url(#lineGlow)" opacity="0.7">
    <animate attributeName="stroke-dashoffset" values="0;-20" dur="2.2s" repeatCount="indefinite"/>
  </path>

  <!-- Unreal side branch from Patient -->
  <path d="M 100 240 Q 60 310 90 360" stroke="#fde68a" stroke-width="1.2"
    stroke-dasharray="5,5" fill="none" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="0;-20" dur="2.5s" repeatCount="indefinite"/>
  </path>

  <!-- =========================================
       NODES
  ========================================== -->

  <!-- NODE 1: Patient Client (left center) -->
  <g transform="translate(100, 165)" filter="url(#glow)">
    <circle cx="0" cy="0" r="70" fill="#1a0f0a" stroke="#fde68a" stroke-width="1.5" opacity="0.95"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#fde68a" stroke-width="1" opacity="0.4">
      <animate attributeName="r" values="70;78;70" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text y="-22" font-family="'Segoe UI', Arial, sans-serif" font-size="28" text-anchor="middle">📱</text>
    <text y="5" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#fde68a">Patient</text>
    <text y="20" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#fde68a">Web App</text>
    <text y="38" font-family="'Segoe UI', Arial, sans-serif" font-size="9" text-anchor="middle" fill="#92400e">React 19 + Vite</text>
    <text y="52" font-family="'Segoe UI', Arial, sans-serif" font-size="9" text-anchor="middle" fill="#92400e">Three.js · UE5</text>
  </g>

  <!-- NODE 2: Express Server (center) -->
  <g transform="translate(500, 200)" filter="url(#glow)">
    <circle cx="0" cy="0" r="82" fill="#081a0e" stroke="#6ee7b7" stroke-width="2" opacity="0.97"/>
    <circle cx="0" cy="0" r="82" fill="none" stroke="#6ee7b7" stroke-width="1.5" opacity="0.3">
      <animate attributeName="r" values="82;92;82" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.05;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <text y="-28" font-family="'Segoe UI', Arial, sans-serif" font-size="32" text-anchor="middle">⚡</text>
    <text y="4" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#6ee7b7">Express + Node 22</text>
    <text y="20" font-family="'Segoe UI', Arial, sans-serif" font-size="9" text-anchor="middle" fill="#065f46">Auth · CSRF · Rate Limit</text>
    <text y="33" font-family="'Segoe UI', Arial, sans-serif" font-size="9" text-anchor="middle" fill="#065f46">WebSockets · Scheduler</text>
    <text y="46" font-family="'Segoe UI', Arial, sans-serif" font-size="9" text-anchor="middle" fill="#065f46">Web Push · REST API</text>
  </g>

  <!-- NODE 3: Private AI (top center) -->
  <g transform="translate(500, 68)" filter="url(#glow)">
    <circle cx="0" cy="0" r="60" fill="#160c2a" stroke="#c4b5fd" stroke-width="1.5" opacity="0.95"/>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#c4b5fd" stroke-width="1" opacity="0.35">
      <animate attributeName="r" values="60;70;60" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.05;0.35" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text y="-18" font-family="'Segoe UI', Arial, sans-serif" font-size="24" text-anchor="middle">🧠</text>
    <text y="5" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#c4b5fd">Private AI</text>
    <text y="20" font-family="'Segoe UI', Arial, sans-serif" font-size="9" text-anchor="middle" fill="#6d28d9">Qwen 2.5:3b</text>
    <text y="33" font-family="'Segoe UI', Arial, sans-serif" font-size="9" text-anchor="middle" fill="#6d28d9">Ollama Offline</text>
  </g>

  <!-- Cloud LLM label under private AI -->
  <g transform="translate(680, 340)">
    <rect rx="12" ry="12" x="-75" y="-25" width="150" height="50" fill="#160c2a" stroke="#c4b5fd" stroke-width="1" opacity="0.8"/>
    <text y="-8" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#c4b5fd">☁️  Cloud LLM Fallback</text>
    <text y="7" font-family="'Segoe UI', Arial, sans-serif" font-size="9" text-anchor="middle" fill="#7c3aed">Groq · Anthropic · OpenAI</text>
  </g>

  <!-- NODE 4: SQLite DB (right center) -->
  <g transform="translate(900, 200)" filter="url(#glow)">
    <circle cx="0" cy="0" r="68" fill="#1a0a10" stroke="#fda4af" stroke-width="1.5" opacity="0.95"/>
    <circle cx="0" cy="0" r="68" fill="none" stroke="#fda4af" stroke-width="1" opacity="0.35">
      <animate attributeName="r" values="68;76;68" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.05;0.35" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <text y="-20" font-family="'Segoe UI', Arial, sans-serif" font-size="26" text-anchor="middle">🗄️</text>
    <text y="5" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#fda4af">SQLite</text>
    <text y="20" font-family="'Segoe UI', Arial, sans-serif" font-size="9" text-anchor="middle" fill="#9f1239">Time Capsule</text>
    <text y="33" font-family="'Segoe UI', Arial, sans-serif" font-size="9" text-anchor="middle" fill="#9f1239">Memory Store</text>
    <text y="46" font-family="'Segoe UI', Arial, sans-serif" font-size="9" text-anchor="middle" fill="#9f1239">Routine · Games</text>
  </g>

  <!-- NODE 5: FHIR Hospital (bottom left) -->
  <g transform="translate(190, 390)" filter="url(#glow)">
    <circle cx="0" cy="0" r="62" fill="#080f1e" stroke="#93c5fd" stroke-width="1.5" opacity="0.95"/>
    <circle cx="0" cy="0" r="62" fill="none" stroke="#93c5fd" stroke-width="1" opacity="0.35">
      <animate attributeName="r" values="62;70;62" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;0.05;0.35" dur="5s" repeatCount="indefinite"/>
    </circle>
    <text y="-18" font-family="'Segoe UI', Arial, sans-serif" font-size="24" text-anchor="middle">🏥</text>
    <text y="4" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#93c5fd">FHIR R4</text>
    <text y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="9" text-anchor="middle" fill="#1d4ed8">Hospital API</text>
    <text y="31" font-family="'Segoe UI', Arial, sans-serif" font-size="9" text-anchor="middle" fill="#1d4ed8">Slot + Appointment</text>
  </g>

  <!-- UE5 sub-label under patient -->
  <g transform="translate(100, 320)">
    <rect rx="10" ry="10" x="-62" y="-20" width="124" height="40" fill="#1a0f0a" stroke="#fde68a" stroke-width="0.8" opacity="0.8"/>
    <text y="-4" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#fde68a">🎮  Unreal 5.5</text>
    <text y="10" font-family="'Segoe UI', Arial, sans-serif" font-size="9" text-anchor="middle" fill="#92400e">3D Home Sim (Pixel Streaming)</text>
  </g>

  <!-- Legend labels on edges -->
  <text x="275" y="192" font-family="'Segoe UI', Arial, sans-serif" font-size="9" text-anchor="middle" fill="#6ee7b7" opacity="0.9">Realtime WS · REST</text>
  <text x="275" y="230" font-family="'Segoe UI', Arial, sans-serif" font-size="9" text-anchor="middle" fill="#fde68a" opacity="0.9">Auth + Session</text>
  <text x="726" y="192" font-family="'Segoe UI', Arial, sans-serif" font-size="9" text-anchor="middle" fill="#fda4af" opacity="0.9">Read/Write</text>
  <text x="726" y="228" font-family="'Segoe UI', Arial, sans-serif" font-size="9" text-anchor="middle" fill="#fda4af" opacity="0.9">node:sqlite</text>

  <!-- Footer tech note -->
  <text x="500" y="500" font-family="'Segoe UI', Arial, sans-serif" font-size="10" text-anchor="middle" fill="#4b5563" letter-spacing="1">
    No external database required · Scrypt password hashing · CSRF guarded · Rate limited · HTTPS ready
  </text>
</svg>
