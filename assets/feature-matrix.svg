<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c0a18"/>
      <stop offset="100%" stop-color="#0a1420"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="220" fill="url(#bg)" rx="12"/>

  <!-- Section title -->
  <text x="500" y="30" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700"
