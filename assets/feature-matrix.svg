  <!-- ===== Card 1: Daily Routine ===== -->
  <g transform="translate(28, 50)">
    <rect rx="14" width="138" height="148" fill="#1a100a" stroke="#fde68a" stroke-width="1.2" opacity="0.95"/>
    <rect rx="14" width="138" height="148" fill="none" stroke="#fde68a" stroke-width="0.6" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="69" y="36" font-size="28" text-anchor="middle">🌅</text>
    <text x="69" y="62" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700"
