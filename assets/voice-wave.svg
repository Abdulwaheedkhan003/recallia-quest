<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="1000" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0c0a18"/>
      <stop offset="50%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#0c0a18"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="25%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="75%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="120" fill="url(#bg)" rx="10"/>

  <!-- Mic icon -->
  <text x="38" y="68" font-size="28" text-anchor="middle">🎙️</text>

  <!-- Animated center line baseline -->
  <line x1="70" y1="60" x2="950" y2="60" stroke="#1f2937" stroke-width="1"/>

  <!-- WAVEFORM BARS — animated heights -->
  <!-- Left quiet zone -->
  <rect x="75" y="54" width="4" height="12" rx="2" fill="url(#waveGrad)" opacity="0.4">
    <animate attributeName="height" values="12;18;8;22;10;12" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="54;51;56;49;55;54" dur="1.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="84" y="50" width="4" height="20" rx="2" fill="url(#waveGrad)" opacity="0.5">
    <animate attributeName="height" values="20;32;14;36;16;20" dur="1.4s" repeatCount="indefinite"/>
    <animate attributeName="y" values="50;44;53;42;52;50" dur="1.4s" repeatCount="indefinite"/>
  </rect>
  <rect x="93" y="45" width="4" height="30" rx="2" fill="url(#waveGrad)" filter="url(#glow)" opacity="0.7">
    <animate attributeName="height" values="30;50;20;55;22;30" dur="1.1s" repeatCount="indefinite"/>
    <animate attributeName="y" values="45;35;50;33;49;45" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- Main speech zone (center-left) -->
  <rect x="103" y="30" width="4" height="60" rx="2" fill="url(#waveGrad)" filter="url(#glow)" opacity="0.9">
    <animate attributeName="height" values="60;20;72;15;65;60" dur="0.8s" repeatCount="indefinite"/>
    <animate attributeName="y" values="30;50;24;53;28;30" dur="0.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="113" y="22" width="5" height="76" rx="2" fill="url(#waveGrad)" filter="url(#glow)" opacity="0.95">
    <animate attributeName="height" values="76;30;85;18;80;76" dur="0.65s" repeatCount="indefinite"/>
    <animate attributeName="y" values="22;45;18;51;20;22" dur="0.65s" repeatCount="indefinite"/>
  </rect>
  <rect x="124" y="35" width="4" height="50" rx="2" fill="url(#waveGrad)" filter="url(#glow)" opacity="0.85">
    <animate attributeName="height" values="50;80;25;70;30;50" dur="0.75s" repeatCount="indefinite"/>
    <animate attributeName="y" values="35;20;48;25;45;35" dur="0.75s" repeatCount="indefinite"/>
  </rect>
  <rect x="134" y="18" width="5" height="84" rx="2" fill="url(#waveGrad)" filter="url(#glow)" opacity="0.95">
    <animate attributeName="height" values="84;40;90;25;88;84" dur="0.6s" repeatCount="indefinite"/>
    <animate attributeName="y" values="18;40;15;48;16;18" dur="0.6s" repeatCount="indefinite"/>
  </rect>
  <rect x="145" y="28" width="4" height="64" rx="2" fill="url(#waveGrad)" filter="url(#glow)" opacity="0.9">
    <animate attributeName="height" values="64;20;70;15;68;64" dur="0.72s" repeatCount="indefinite"/>
    <animate attributeName="y" values="28;50;25;53;26;28" dur="0.72s" repeatCount="indefinite"/>
  </rect>
  <rect x="155" y="40" width="4" height="40" rx="2" fill="url(#waveGrad)" opacity="0.75">
    <animate attributeName="height" values="40;60;22;55;28;40" dur="0.9s" repeatCount="indefinite"/>
    <animate attributeName="y" values="40;30;49;33;46;40" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <!-- Language label area -->
  <text x="245" y="45" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#fde68a" opacity="0.9">
    हिन्दी  ·  தமிழ்  ·  తెలుగు  ·  বাংলা  ·  मराठी
  </text>
  <text x="245" y="63" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#6ee7b7" opacity="0.85">
    English  ·  ਪੰਜਾਬੀ  ·  ଓଡ଼ିଆ  ·  অসমীয়া  ·  नेपाली
  </text>
  <text x="245" y="81" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#93c5fd" opacity="0.8">
    Mizo  ·  Khasi  ·  A·chik  ·  Kokborok  ·  Nagamese
  </text>

  <!-- Right waveform bars -->
  <rect x="615" y="40" width="4" height="40" rx="2" fill="url(#waveGrad)" opacity="0.75">
    <animate attributeName="height" values="40;65;18;58;26;40" dur="0.88s" repeatCount="indefinite"/>
    <animate attributeName="y" values="40;28;51;31;47;40" dur="0.88s" repeatCount="indefinite"/>
  </rect>
  <rect x="625" y="28" width="5" height="64" rx="2" fill="url(#waveGrad)" filter="url(#glow)" opacity="0.9">
    <animate attributeName="height" values="64;25;72;18;68;64" dur="0.7s" repeatCount="indefinite"/>
    <animate attributeName="y" values="28;48;24;51;26;28" dur="0.7s" repeatCount="indefinite"/>
  </rect>
  <rect x="636" y="18" width="5" height="84" rx="2" fill="url(#waveGrad)" filter="url(#glow)" opacity="0.95">
    <animate attributeName="height" values="84;35;92;20;88;84" dur="0.58s" repeatCount="indefinite"/>
    <animate attributeName="y" values="18;43;14;50;16;18" dur="0.58s" repeatCount="indefinite"/>
  </rect>
  <rect x="647" y="32" width="4" height="56" rx="2" fill="url(#waveGrad)" filter="url(#glow)" opacity="0.85">
    <animate attributeName="height" values="56;80;28;72;32;56" dur="0.66s" repeatCount="indefinite"/>
    <animate attributeName="y" values="32;20;46;24;44;32" dur="0.66s" repeatCount="indefinite"/>
  </rect>
  <rect x="657" y="22" width="5" height="76" rx="2" fill="url(#waveGrad)" filter="url(#glow)" opacity="0.95">
    <animate attributeName="height" values="76;28;88;15;82;76" dur="0.62s" repeatCount="indefinite"/>
    <animate attributeName="y" values="22;46;16;53;19;22" dur="0.62s" repeatCount="indefinite"/>
  </rect>
  <rect x="668" y="30" width="4" height="60" rx="2" fill="url(#waveGrad)" filter="url(#glow)" opacity="0.9">
    <animate attributeName="height" values="60;18;70;15;65;60" dur="0.78s" repeatCount="indefinite"/>
    <animate attributeName="y" values="30;51;25;53;28;30" dur="0.78s" repeatCount="indefinite"/>
  </rect>
  <rect x="678" y="45" width="4" height="30" rx="2" fill="url(#waveGrad)" opacity="0.65">
    <animate attributeName="height" values="30;48;16;42;20;30" dur="0.95s" repeatCount="indefinite"/>
    <animate attributeName="y" values="45;36;52;39;50;45" dur="0.95s" repeatCount="indefinite"/>
  </rect>
  <rect x="688" y="52" width="4" height="16" rx="2" fill="url(#waveGrad)" opacity="0.45">
    <animate attributeName="height" values="16;28;10;24;12;16" dur="1.3s" repeatCount="indefinite"/>
    <animate attributeName="y" values="52;46;55;48;54;52" dur="1.3s" repeatCount="indefinite"/>
  </rect>

  <!-- Speaker / TTS icon -->
  <text x="730" y="68" font-size="24" text-anchor="middle">🔊</text>

  <!-- Caption on right -->
  <text x="790" y="53" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#c4b5fd">Speech-to-Text Input</text>
  <text x="790" y="70" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#86efac">Text-to-Speech Output</text>
  <text x="790" y="87" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#6b7280">Web Speech API · 30+ Languages</text>
</svg>
